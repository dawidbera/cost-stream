# Docker Compose file for local development and testing environment.
# Spins up PostgreSQL 16 with pre-configured credentials and Redis 7 for caching and deduplication.
version: "3.8"

services:
  # Primary relational database for telemetry storage and FinOps aggregation queries
  postgres:
    image: postgres:16-alpine
    container_name: coststream-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coststream
      POSTGRES_USER: coststream
      POSTGRES_PASSWORD: coststream_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/adapters/out/postgres/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coststream -d coststream"]
      interval: 5s
      timeout: 5s
      retries: 5

  # In-memory store for idempotency key deduplication and fast query caching
  redis:
    image: redis:7-alpine
    container_name: coststream-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
