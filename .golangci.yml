# golangci-lint configuration file (schema version 2).
# Configures strict static analysis rules for idiomatic Go code while ignoring auto-generated files.
version: "2"

run:
  # Analyze unit and integration test files
  tests: true

linters:
  # Additional linters enabled on top of defaults (errcheck, govet, ineffassign, staticcheck, unused)
  enable:
    - gocritic
    - revive
    - unconvert
  settings:
    govet:
      enable:
        - shadow
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - errcheck
          - govet
          - revive
        path: \.pb\.go|\.pb\.gw\.go
    paths:
      - api/proto
      - internal/adapters/out/postgres/db
      - third_party$
      - builtin$
      - examples$

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
