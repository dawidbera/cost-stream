# golangci-lint configuration file.
# Configures strict static analysis rules for idiomatic Go code while ignoring auto-generated files.
run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - revive
    - staticcheck
    - typecheck
    - unconvert
    - unused

linters-settings:
  govet:
    enable:
      - shadow
  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf

issues:
  exclude-dirs:
    - api/proto
    - internal/adapters/out/postgres/db
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - path: \.pb\.go|\.pb\.gw\.go
      linters:
        - revive
        - govet
        - errcheck
